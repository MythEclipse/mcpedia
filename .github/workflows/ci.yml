name: CI

# Two jobs. The gate is `moon`; pnpm is still used to install, because that is
# what the lockfile is for.
#
#   check   — the gate. `moon run :check` runs the five-app typecheck, the whole
#             vitest suite, the three service bundles and the migration-drift
#             check. Nothing reaches the host unless all four pass.
#   deploy  — copies scripts/deploy-direct.sh to the host and runs it there
#             with this SHA. Building happens ON the host (see the comments in
#             that script), so CI and production share one node_modules and a
#             bundle can never be built against a different lockfile than the
#             one the gate verified.
#
# The old pipeline built Nix derivations, pushed them to the Attic cache and
# flipped a `nix-env` profile. Nix was uninstalled from the host, so every one
# of those steps is dead; the systemd units under /opt/mcpedia-* are the
# deployment target now.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VPS_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
  VPS_USER: ${{ secrets.SSH_DEPLOY_USER }}

permissions:
  contents: read

jobs:
  check:
    name: moon check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `fetch-depth: 0` is LOAD-BEARING, not a size preference.
          #
          # `actions/checkout` defaults to depth=1. moon hashes task inputs from
          # the changed-files set, which it computes as a diff against the merge
          # base — and on a shallow clone that merge base does not exist, so git
          # exits 128 and the whole gate dies:
          #
          #   WARN moon_app::queries::changed_files  Detected a shallow checkout
          #        while comparing against an explicit base…
          #   WARN moon_vcs::git::git_client  Unable to resolve a merge base
          #        between the base and head revisions…
          #   Error: process::failed
          #     × Process git failed: exit code 128
          #
          # It looks like a checkout or network fault and is neither. Verified by
          # reproduction: `git merge-base origin/main HEAD` returns rc=1 on a
          # `--depth=1` clone and rc=0 immediately after `--unshallow`. Because
          # it is non-deterministic in WHICH tasks it affects, it also silently
          # weakens the gate — tasks can be skipped as "unaffected" when they are
          # not.
          #
          # release.yml already sets this; this job did not, which is why Release
          # stayed green while `moon check` failed.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installed BEFORE moon, not after: moon hashes task inputs from the
      # installed tree, and a project whose node_modules is missing hashes
      # differently from one that has it. Installing second would make the
      # gate's own result depend on step order.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # moon 2.6.1, pinned to exactly the version this workspace is written
      # against — .moon/tasks/all.yml documents several 2.6.1-specific
      # behaviours (the `.moon/tasks/` DIRECTORY requirement, `..` being
      # rejected in input paths, no top-level `cache` key on a task), so a
      # floating "latest" would silently change the task graph's meaning.
      #
      # This is moon's OWN installer, verified by reading it rather than
      # recalled: https://moonrepo.dev/install/moon.sh takes the version as $1
      # and, for any 2.x, delegates to the pinned release installer at
      # `releases/download/v${version}/moon_cli-installer.sh`. The older
      # `moonrepo/setup-moon-action` is NOT used — GitHub archived it in Oct
      # 2023 and it is read-only.
      - name: Install moon
        env:
          MOON_VERSION: "2.6.1"
        run: |
          # Pipe to BASH, not sh. moonrepo's installer is a bash script — its
          # line 7 is `set -eo pipefail`, which dash rejects outright with
          # "set: Illegal option -o pipefail" and exits 2. The runner's /bin/sh
          # is dash, so `... | sh` fails before moon is ever downloaded. A
          # pipe cannot carry the shebang, so the interpreter has to be named
          # on the left of the pipe.
          curl --proto '=https' --tlsv1.2 -LsSf https://moonrepo.dev/install/moon.sh | bash -s -- "$MOON_VERSION"
          # Export PATH for the REST OF THIS STEP as well as for later ones.
          # Appending to GITHUB_PATH only takes effect in subsequent steps —
          # each `run:` block is a fresh shell — so the bare `moon` call below
          # needs the export, and the bare `moon run :check` two steps later
          # needs the GITHUB_PATH half.
          export PATH="$HOME/.moon/bin:$PATH"
          "$HOME/.moon/bin/moon" --version
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The `check` task sets `options.cache: false` — it cannot be cached,
      # because its inputs are workspace-wide and moon resolves an input glob
      # only within the declaring project (verified: `..` traversal is rejected
      # outright). Deleting the cache directory as well is belt-and-braces for
      # the `deps: [typecheck]` tasks, which ARE cached and would otherwise let
      # a run report "cached" for a source change.
      #
      # Cost: ~20s of typecheck re-run per CI job. Worth it — a gate that can
      # report green without having looked is worse than no gate.
      - name: Clear moon cache
        run: rm -rf .moon/cache

      # `moon run :check` is the whole gate: typecheck, tests, bundles, and the
      # migration-drift check. It is defined once, in scripts/moon.yml, so this
      # workflow and a developer running the same command locally execute an
      # identical definition of "green" rather than two lists that can drift.
      - name: moon run :check
        run: moon run :check

      # The payload the deploy job ships.
      #
      # Everything here is self-contained: the three service bundles plus the
      # migration worker are esbuild output with every workspace import and
      # npm dependency resolved in, and the SPA dist is static files. That is
      # what makes the host able to deploy without a checkout, node_modules or a
      # toolchain — the build stays here, where the gate just verified it.
      #
      # The .sql journal rides along with the migrate bundle because drizzle
      # reads it from disk relative to the bundle; the assemble step on the host
      # asserts it is present, because its absence fails as "no migrations
      # found", which reads like success.
      - name: Assemble release payload
        run: |
          set -euo pipefail

          # Both builds run HERE, not on the host.
          #
          # `moon run :build` is NOT enough, and finding that out cost a red run:
          # only apps/web and apps/mcp-client declare a `build` task, so :build
          # produces the SPA dist and nothing else. The three service bundles —
          # and now the migration worker — come from scripts/build-bundles.mjs,
          # which has never been part of moon's task graph. The old deploy called
          # it explicitly on the host, so the gap only surfaced once the build
          # moved to CI.
          pnpm run build:bundles
          pnpm run build

          rm -rf payload && mkdir -p payload/api payload/mcp payload/worker payload/web

          cp apps/api/dist/index.js    payload/api/index.js
          cp apps/api/dist/migrate.js  payload/api/migrate.js
          cp -a apps/api/dist/drizzle  payload/api/drizzle
          cp apps/mcp/dist/http.js     payload/mcp/http.js
          cp apps/worker/dist/index.js payload/worker/index.js
          cp -a apps/web/dist/.        payload/web/
          cp apps/web/serve.mjs        payload/web/serve.mjs

          echo "payload:"
          find payload -type f -printf '  %-44p %8s bytes\n' | sort

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: mcpedia-payload
          path: payload/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: deploy to host
    needs: check
    # GATED ON THE MAIN REF ON PURPOSE — a `pull_request` run must NOT deploy.
    #
    # `needs: check` only ORDERS the jobs; it does not restrict which EVENTS reach
    # them. So a Dependabot PR used to run this whole job and die in "Setup SSH
    # key", because GitHub hands a Dependabot-triggered run the DEPENDABOT secret
    # store (empty here) rather than the repository one. `SSH_DEPLOY_KEY` arrived
    # as an empty string, `printf` wrote a zero-byte key, and `ssh-keygen -y`
    # rejected it:
    #
    #   failure | Setup SSH key
    #
    # The result was a red X no agent could ever clear: a dependency bump cannot
    # fix a missing credential, and the worker saw only "CI FAILED: deploy to
    # host". It retried a structural impossibility — the failure was in the
    # WORKFLOW, not in the bump. Verified: `gh api .../dependabot/secrets` lists
    # nothing while the repo store holds all five.
    #
    # `github.ref` is the check, NOT `event_name`. On a PR it is
    # `refs/pull/<n>/merge`, so PRs are excluded — and this is the exact trap that
    # makes `event_name` the wrong tool:
    #
    #   A manual `workflow_dispatch` runs the workflow file FROM THE DISPATCHED
    #   REF, and a manual dispatch DOES receive the repository secrets. So an
    #   `event_name == 'push'` gate still let a dispatch against a PR branch
    #   deploy unreviewed code here — which is what happened on 2026-10-17
    #   (a dispatch against `dependabot/npm_and_yarn/production-5ea6f72007`
    #   flipped every `current` symlink to that branch's SHA).
    #
    # Keying on the ref covers push-to-main and dispatch-on-main while excluding
    # both PRs and dispatches against any other branch, so the manual deploy path
    # stays available and cannot be pointed at a branch.
    #
    # Two properties matter and neither is cosmetic:
    #   - a PR must never deploy (it would publish unreviewed code to the host);
    #   - a PR must not RUN the deploy job, or every Dependabot PR wears a
    #     permanent red X and the worker chases it forever.
    if: ${{ github.ref == 'refs/heads/main' }}
    # Serialised against itself. Two deploys racing on the same host would both
    # assemble releases/ and flip `current`, and the loser's symlink flip would
    # land after the winner's — leaving the older release running under a log
    # that says the newer one shipped.
    concurrency:
      group: mcpedia-deploy
      cancel-in-progress: false

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout is required even though the artifact is built below: the deploy
      # script and the unit files are scp'd from THIS checkout, never from the
      # payload. A fix to either could never take effect if the copy that
      # applies it were the stale one.
      - name: Checkout
        uses: actions/checkout@v5
        # This job only consumes the payload and scp's files from the checkout —
        # it never runs moon — so full history is not needed here. The gate job
        # above DOES need it (see its `fetch-depth: 0` comment).

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: mcpedia-payload
          path: payload

      - name: Assemble the payload
        run: |
          set -euo pipefail
          # The service bundles and the SPA dist are self-contained, so they are
          # what ships. Nothing else from the checkout is uploaded: node_modules,
          # .moon and the workspace source stay on the runner, which is the whole
          # point — the host no longer needs a toolchain to deploy.
          test -f payload/api/index.js      || { echo "missing api bundle"; exit 1; }
          test -f payload/mcp/http.js       || { echo "missing mcp bundle"; exit 1; }
          test -f payload/worker/index.js   || { echo "missing worker bundle"; exit 1; }
          test -f payload/api/migrate.js    || { echo "missing migrate bundle"; exit 1; }
          test -f payload/api/drizzle/0000_military_wolfpack.sql \
            || { echo "missing migration journal"; exit 1; }
          test -f payload/web/serve.mjs     || { echo "missing SPA server"; exit 1; }
          test -f payload/web/index.html    || { echo "missing SPA index"; exit 1; }
          echo "payload:"
          find payload -type f | sed 's/^/  /'

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # GitHub secrets store raw keys; a CRLF turns every ssh invocation
          # into "invalid format".
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy payload and deploy script to host
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/mcpedia-payload && mkdir -p /tmp/mcpedia-payload'
          scp -q -r payload/. "$VPS_USER@$VPS_HOST:/tmp/mcpedia-payload/"
          scp -q scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/mcpedia-deploy.sh"
          # The launchers are repo files rather than build output, but they still
          # have to be on the host: ExecStart invokes them, and the host no longer
          # checks anything out.
          mkdir -p systemd-staging
          # Units and launchers are staged FLAT, side by side, even though they
          # live in two directories in the repo. The deploy script reads both
          # from one $SYSTEMD_DIR, so flattening here keeps that contract and
          # leaves the repo layout free to be organised by kind.
          cp infra/systemd/*.service systemd-staging/
          cp infra/systemd/launchers/*.sh systemd-staging/
          # CLEAR THE DESTINATION FIRST, exactly as the payload above does.
          #
          # `scp -r systemd-staging /tmp/mcpedia-systemd` does NOT mean "make the
          # destination look like this directory" — when the destination already
          # exists, scp copies the SOURCE directory INTO it, producing
          # /tmp/mcpedia-systemd/systemd-staging/*. The host keeps its /tmp across
          # deploys, so from the second deploy onward every file landed one level
          # down.
          #
          # That failure is worse than a plain miss because it is PARTIAL: the
          # stale flat files from the previous deploy were still in place, so the
          # unit check found its .service and passed, and only the launcher check
          # failed — on a launcher whose NAME had changed, so nothing caught it
          # until this deploy. Removing the directory makes the deploy's inputs
          # exactly what this run produced, which is the only way its preflight
          # checks mean anything.
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'rm -rf /tmp/mcpedia-systemd && mkdir -p /tmp/mcpedia-systemd'
          scp -q -r systemd-staging/. "$VPS_USER@$VPS_HOST:/tmp/mcpedia-systemd/"

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          echo "=== Deploying ${{ github.sha }} to $VPS_HOST ==="
          ssh "$VPS_USER@$VPS_HOST" \
            "sed -i 's/\r$//' /tmp/mcpedia-deploy.sh && \
             ARTIFACT_DIR=/tmp/mcpedia-payload SYSTEMD_DIR=/tmp/mcpedia-systemd \
             BWS_PROJECT_ID=27210268-6134-47b3-9a68-b4980079d1ec \
             bash /tmp/mcpedia-deploy.sh ${{ github.sha }}"
          echo "deploy finished"

      - name: Verify services
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "for u in mcpedia-api mcpedia-mcp mcpedia-worker mcpedia-web; do \
               printf '  %-16s -> %s\n' \"\$u\" \"\$(systemctl is-active \$u)\"; \
             done; \
             echo '--- releases ---'; \
             for s in api mcp worker web; do \
               printf '  %-8s -> %s\n' \"\$s\" \"\$(basename \$(readlink -f /opt/mcpedia-\$s/current))\"; \
             done; \
             echo '--- HTTP ---'; \
             for url in http://127.0.0.1:4020/health http://127.0.0.1:4021/mcp http://127.0.0.1:4016/ https://wiki.asepharyana.my.id/; do \
               code=\$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 \$url); \
               printf '  %s -> %s\n' \"\$url\" \"\$code\"; \
             done"
