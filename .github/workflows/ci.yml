name: CI

# Two jobs, both pnpm + Node:
#
#   test    — the gate. typecheck, the test suite, the three production
#             bundles and the Next.js build must all succeed on the runner
#             before anything reaches the host.
#   deploy  — copies scripts/deploy-direct.sh to the host and runs it there
#             with this SHA. Building happens ON the host (see the comments in
#             that script), so CI and production share one node_modules and a
#             bundle can never be built against a different lockfile than the
#             one the gate verified.
#
# The old pipeline built Nix derivations, pushed them to the Attic cache and
# flipped a `nix-env` profile. Nix was uninstalled from the host, so every one
# of those steps is dead; the systemd units under /opt/mcpedia-* are the
# deployment target now.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VPS_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
  VPS_USER: ${{ secrets.SSH_DEPLOY_USER }}

permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Build the three service bundles on the runner too: a source change that
      # esbuild refuses to bundle should fail here, not halfway through a
      # deploy on the host.
      - name: Build service bundles
        run: pnpm build:bundles

      - name: Build Next.js
        run: pnpm --filter @mcpedia/web build

  deploy:
    name: deploy to host
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # GitHub secrets store raw keys; a CRLF turns every ssh invocation
          # into "invalid format".
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via scripts/deploy-direct.sh
        # The script is scp'd from THIS checkout, never run from
        # /home/code/mcpedia: a fix to the deploy script could never take
        # effect if the copy that applies it is the stale one.
        run: |
          echo "=== Deploying ${{ github.sha }} to $VPS_HOST ==="
          scp -q scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/mcpedia-deploy.sh"
          ssh "$VPS_USER@$VPS_HOST" \
            "sed -i 's/\r$//' /tmp/mcpedia-deploy.sh && bash /tmp/mcpedia-deploy.sh ${{ github.sha }}"
          echo "deploy finished"

      - name: Verify services
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "for u in mcpedia-api mcpedia-mcp mcpedia-worker mcpedia-web; do \
               printf '  %-16s -> %s\n' \"\$u\" \"\$(systemctl is-active \$u)\"; \
             done; \
             echo '--- HTTP ---'; \
             for url in http://127.0.0.1:4020/health http://127.0.0.1:4016/ https://wiki.asepharyana.my.id/; do \
               code=\$(curl -sk -o /dev/null -w '%{http_code}' --max-time 8 \$url); \
               printf '  %s -> %s\n' \"\$url\" \"\$code\"; \
             done"
