# nginx config for the MCPedia SPA image.
#
# These are the SAME routes the Vite dev proxy declares in vite.config.ts, and
# the same ones Caddy forwards in production:
#
#   /rpc   -> oRPC mount   (apps/api/src/app.ts mounts one RPCHandler at each)
#   /trpc  -> oRPC mount   (the SPA's client is switchable between them)
#   /api/auth -> better-auth catch-all
#
# The auth route is same-origin on purpose. better-auth's session cookie is
# first-party only; a cross-origin call drops it, so proxying to a different
# ORIGIN would break sign-in while looking perfectly correct in a dev proxy.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Declared HERE, inside the server block — see the note in the Dockerfile about
  # why this is not at http level. 00-upstream.conf supplies the resolver.
  set $api_upstream mcpedia-api:4020;

  # Resolve the API host LAZILY. nginx resolves a literal proxy_pass hostname at
  # STARTUP, so with the api absent it aborts before serving a byte:
  #   nginx: [emerg] host not found in upstream "mcpedia-api"
  # That makes this image order-dependent — it only boots if the api container
  # happens to exist first, which a fresh `docker compose up` does not guarantee.
  # A variable in proxy_pass defers resolution to request time: nginx always
  # starts, and only requests that need the api return 502 while it is down.
  # Declared at http level in 00-upstream.conf, injected by the Dockerfile.
  # Headers are inlined rather than `include /etc/nginx/proxy_params`: that file
  # ships with Debian's nginx-extras and does NOT exist in the official image, so
  # including it fails startup with a message about a missing file rather than
  # about the misconfiguration.
  location /rpc/ {
    proxy_pass http://$api_upstream/rpc/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /trpc/ {
    proxy_pass http://$api_upstream/trpc/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/auth {
    proxy_pass http://$api_upstream/api/auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable by name. Long cache, and skip the
  # revalidation round-trip that would otherwise hit every image request.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every unmatched path returns index.html so client-side routes
  # survive a reload. Excluded from the asset rule above, which must 404 rather
  # than silently return HTML for a missing .js — that mismatch is what turns a
  # stale index.html into a blank page instead of a visible error.
  location / {
    try_files $uri $uri/ /index.html;
  }
}