# moon project configuration.
#
# moon does NOT infer these edges from package.json `workspace:*` dependencies
# or from the installed node_modules symlinks — verified against a full clone of
# this repo with pnpm install completed, `moon project <id>` still reported
# "Depends on: —". They must be declared here.
#
# Transcribed from the @mcpedia/* dependencies in this package's package.json.
# Keep in sync when adding a workspace dependency.

$schema: 'https://moonrepo.dev/schemas/moon-project.json'

dependsOn:
  - 'config'
  - 'core'
  - 'queue'
  - 'types'

tasks:
  build:
    # `vite build`. Not a bare `vite`: moon does not put node_modules/.bin on the
    # task PATH, and under pnpm's isolated linker the binary lives in
    # apps/web/node_modules/.bin, not the workspace root — so even a
    # root-relative guess would be wrong here.
    command: './node_modules/.bin/vite build'
    inputs:
      - '@globs(sources)'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
    outputs:
      - 'dist/**'

# NOTE: there is no longer a `build-next` task, and `build` no longer depends on
# one. Next.js has been removed from this package — the `app/` tree, `next.config.ts`
# and the `next` dependency are all gone, and apps/web is served as static files
# from `dist/` by the API process (see apps/api/src/app.ts).
#
# That task existed to keep a rollback path runnable while the SPA was being
# built out. It was the last thing still referencing `next`, and it failed the
# build outright once the app/ tree was deleted: `moon run :build` could not
# succeed while depending on a build whose inputs no longer existed.
#
# If Next ever comes back, it comes back as its own package with its own task —
# not as a second build inside this one. Two builds in one project meant two
# output directories and a dependency edge whose only purpose was to preserve an
# escape hatch that was never used.