<!doctype html>
<html lang="en" class="h-full scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Wiki</title>
		<meta
			name="description"
			content="An open knowledge base: reference documentation, CTF writeups and working notes, with full-text and semantic search."
		/>
		<!--
			The theme bootstrap, inline and BEFORE any stylesheet or module.

			It is inline because it must run before first paint: the `.dark` class
			has to be on <html> by the time the browser paints, or the page flashes
			light and then repaints dark. A module script is deferred by
			definition, so the same code in main.tsx would always be too late.

			The key and the predicate are byte-identical to THEME_STORAGE_KEY and
			ThemeToggle's "stored, else system preference" rule. Two places read
			this decision, so they must agree; src/lib/site.test.ts asserts this
			file against those constants so a rename cannot desync them. The
			try/catch mirrors the original, because localStorage THROWS in a
			blocked-cookies context and an exception here would leave the document
			unstyled-by-theme.

			The title and the description above are literals for the same reason:
			this file is the static shell, so nothing can import them. They are
			asserted against src/lib/site.ts for the same reason.
		-->
		<script>
			// Every `var` is declared at the top level of the IIFE rather than
			// inside the `try`: Biome's noInnerDeclarations flags a declaration
			// nested in a block, and a `var` is function-scoped regardless, so
			// hoisting it costs nothing and states the intent.
			//
			// The IIFE is an arrow so it inherits `this`; irrelevant here, but it
			// is what the linter asks for.
			;(() => {
				var isDark = false
				var stored = null
				try {
					stored = localStorage.getItem("wiki-theme")
				} catch (e) {
					// localStorage THROWS when cookies are blocked. `stored` stays
					// null, which the rule below reads as "no preference" — the same
					// answer as a first-time visitor, and the correct default.
				}
				try {
					isDark =
						stored === "dark" ||
						(stored === null &&
							window.matchMedia("(prefers-color-scheme: dark)").matches)
				} catch (e) {
					// matchMedia is absent in very old browsers. Light is the safe
					// fallback, matching the CSS default.
				}
				document.documentElement.classList.toggle("dark", isDark)
			})()
		</script>
	</head>
	<body
		class="min-h-screen bg-[var(--bg-app)] text-[var(--text-secondary)] font-sans antialiased selection:bg-[var(--text-primary)] selection:text-[var(--bg-app)] flex flex-col transition-colors duration-150"
	>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
