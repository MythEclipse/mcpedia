# Workspace-inherited tasks.
#
# IMPORTANT: this file must live at `.moon/tasks/all.yml` — a DIRECTORY named
# `tasks` containing yaml files. A flat `.moon/tasks.yml` is the v1-era path and
# moon 2.6.1 silently ignores it: `moon run <proj>:typecheck` fails with
# "Unknown task" and `moon project <id> --json` reports `inheritedTasks: {}`,
# with no error or warning to suggest the file was wrong.
#
# The same directory is where `fileGroups`, `env`, `implicitDeps`,
# `implicitInputs`, `inheritedBy` and `taskOptions` belong.
# Docs: https://moonrepo.dev/docs/config/tasks

fileGroups:
  sources:
    - 'src/**/*'
    - 'app/**/*'
  configs:
    - '*.json'
    - 'tsconfig.json'

implicitInputs:
  - 'package.json'

tasks:
  typecheck:
    # NOT a bare `tsc`. moon does not put node_modules/.bin on the task PATH —
    # verified: a bare `tsc` inside a moon task resolves to the GLOBAL
    # /home/code/.local/bin/tsc, which is TypeScript 7.0.2, not the 5.9.3 this
    # repo pins. That mismatch was live here until it was caught: the task was
    # typechecking the whole workspace with the wrong compiler and still
    # reporting success. An explicit relative path is the only way to be sure
    # which compiler ran.
    command: '../../node_modules/typescript/bin/tsc'
    args: ['--noEmit']
    # Only the 5 apps/ projects ship a tsconfig.json. The 8 packages/ projects
    # publish raw TypeScript through `exports: { ".": "./src/index.ts" }` and are
    # typechecked TRANSITIVELY by whichever app imports them — verified by
    # injecting a type error into packages/core and watching apps/api report it.
    # (`scripts` is a 9th tsconfig-less project: in neither apps/ nor packages/.)
    #
    # A `condition` check SKIPS the task when its script exits 0, hence the `!`:
    # "skip when there is no tsconfig here". Without this gate, `tsc --noEmit`
    # prints its help text and exits 1 in the 8 tsconfig-less packages, so
    # `moon run :typecheck` fails.
    checks:
      - check: 'condition'
        script: 'test ! -f tsconfig.json'
    inputs:
      - '@globs(sources)'
      # 'tsconfig.json' as a literal input makes moon emit a hasher warning in the
      # 9 projects that have none ("Attempted to hash ... but it does not exist,
      # skipping"). The glob form below is satisfied by tsconfig.json when it
      # exists and by nothing when it does not, with no warning.
      - '@globs(configs)'
      # moon rejects `..` traversal in input paths, so the shared
      # tsconfig.base.json cannot be referenced from an inherited task.
      #
      # KNOWN GAP: tsconfig.base.json is therefore outside the task hash. Editing
      # it (e.g. tightening strictness) will NOT invalidate a cached typecheck —
      # the task reports "cached" and the change goes unnoticed until something
      # else touches a project source. Confirmed: typecheck is cacheable
      # (prime -> completed, second run -> cached).
      #
      # Mitigations in place: CI runs `moon run :typecheck` with a fresh
      # .moon/cache on every run (see the cache action in ci.yml), so every CI
      # run is cold and always typechecks. This only bites a developer running
      # moon locally. If it matters, delete .moon/cache after touching
      # tsconfig.base.json.
    #
    # DEPENDENCY GRAPH: `deps: ['^:typecheck']`, NOT `^:build`.
    #
    # `^:build` was wrong for this repo. Most packages have no build at all
    # (they publish raw TS), and the two that do — web and mcp-client — build
    # the same sources typecheck already read, so depending on their build made
    # typecheck pay for a Vite/esbuild run it does not consume. Worse, it
    # inverted the meaning: a typecheck could be cached as "up to date" because
    # the build it waited on was cached, which is a dependency-ordering claim,
    # not a correctness one.
    #
    # `^:typecheck` states what is actually needed: this project's types are
    # checked after every project it depends on. It also means a type error
    # introduced in packages/core surfaces in packages/queue before apps/api is
    # reached, rather than only at the app that happens to import it.
    deps:
      - '^:typecheck'

  build:
    # Only apps/web and apps/mcp-client define a real build (vite build / esbuild);
    # the other 11 packages publish raw TypeScript via exports "./src/index.ts"
    # and have no build step. Do NOT set implicitDeps: ['^:build'] here — it would
    # depend on tasks that do not exist for 11 of the 14 projects.
    #
    # `outputs` is deliberately omitted. Declaring `dist/**` on an INHERITED
    # build makes `moon run :build` fail outright with task_runner::missing_outputs
    # for the 11 projects that write nothing there ("defines outputs but after
    # being ran, either none or not all of them exist"). Those projects override
    # or drop the task in their own moon.yml; only the two that actually emit
    # dist/ declare outputs, and they do so locally.
    inputs:
      - '@globs(sources)'

# NOTE: `dev`, `test`, `lint` and `format` are intentionally NOT defined here yet.
#   - `test` and `build:bundles` run from the repo root (single vitest.config.mts,
#     single esbuild script) and are not meaningfully project-scoped.
#   - `dev` differs per app (vite / tsx src/index.ts) and would be overridden
#     in each apps/*/moon.yml anyway.
# Defining them as placeholder tasks that echo would make `moon run :test` look
# like it did something. They get real per-project definitions as each app is
# migrated.